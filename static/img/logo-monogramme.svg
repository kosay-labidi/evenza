<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Évenza — monogramme">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400;1,500&amp;family=Inter:wght@400;500&amp;display=swap');
      .serif { font-family: 'Cormorant Garamond', 'Cormorant', Georgia, serif; }
      .sans  { font-family: Inter, 'Segoe UI', sans-serif; }
    </style>

    <!-- Texture lin / toile -->
    <filter id="linen" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9 0.08" numOctaves="2" seed="3" result="h"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.08 0.9" numOctaves="2" seed="7" result="v"/>
      <feBlend in="h" in2="v" mode="multiply" result="n"/>
      <feColorMatrix in="n" type="matrix"
        values="0 0 0 0 0.16
                0 0 0 0 0.08
                0 0 0 0 0.12
                0 0 0 0.55 0"/>
    </filter>

    <!-- Vignettage doux -->
    <radialGradient id="vignette" cx="50%" cy="48%" r="70%">
      <stop offset="0" stop-color="#512D3B"/>
      <stop offset="1" stop-color="#341C27"/>
    </radialGradient>
  </defs>

  <!-- Fond bordeaux texturé -->
  <rect width="600" height="600" fill="url(#vignette)"/>
  <rect width="600" height="600" filter="url(#linen)" opacity=".55"/>

  <!-- Grand monogramme embossé en arrière-plan -->
  <g class="serif" font-size="500" font-weight="400" text-anchor="middle">
    <text x="304" y="474" fill="#5E3646" opacity=".6">E<tspan font-style="italic" dx="-60">V</tspan></text>
    <text x="296" y="466" fill="#221219" opacity=".5">E<tspan font-style="italic" dx="-60">V</tspan></text>
    <text x="300" y="470" fill="#462733">E<tspan font-style="italic" dx="-60">V</tspan></text>
  </g>

  <!-- Monogramme principal (recentré) -->
  <g transform="translate(0 18)">
  <g class="serif" text-anchor="middle">
    <text x="300" y="330" font-size="150" font-weight="500" fill="#F7F3EB">E<tspan font-style="italic" font-weight="400" dx="-30" fill="#F1DCD9">V</tspan></text>
  </g>
  <!-- Étincelle champagne -->
  <path d="M214 262l4 11 11 4-11 4-4 11-4-11-11-4 11-4z" fill="#D0A06D"/>
  <circle cx="372" cy="214" r="2.4" fill="#D0A06D" opacity=".8"/>
  </g>

</svg>
