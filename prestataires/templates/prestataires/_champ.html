{% comment %} Un champ de formulaire : label, champ, aide, erreurs en rouge. Variable : champ (BoundField). {% endcomment %}
<div class="pr-field{% if champ.errors %} has-error{% endif %}">
  <label for="{{ champ.id_for_label }}">{{ champ.label }}{% if champ.field.required %}<span class="pr-requis" aria-hidden="true">*</span>{% endif %}</label>
  {{ champ }}
  {% if champ.help_text %}<small class="pr-aide">{{ champ.help_text }}</small>{% endif %}
  {% for e in champ.errors %}<small class="pr-err" role="alert">{{ e }}</small>{% endfor %}
</div>
