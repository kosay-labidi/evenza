{% extends "app_base.html" %}
{% block banner %}
<section class="page-banner"><div class="container"><span class="eyebrow">{% block eyebrow %}Formulaire{% endblock %}</span><h1>{% block heading %}{% endblock %}</h1></div></section>
{% endblock %}
{% block content %}
<section class="card narrow form-card">
  <form method="post" enctype="multipart/form-data" class="form">
    {% csrf_token %}
    {% include "partials/form_fields.html" %}
    <div class="actions">
      <button class="btn primary" type="submit">{% block submit %}Enregistrer{% endblock %}</button>
      <a class="btn ghost" href="{% block cancel %}javascript:history.back(){% endblock %}">Annuler</a>
    </div>
  </form>
</section>
{% endblock %}
